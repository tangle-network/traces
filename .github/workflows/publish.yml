name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      existing_tag:
        description: 'Existing v* tag to publish without creating a new version commit'
        required: true
        type: string

concurrency:
  group: traces-publish
  cancel-in-progress: false

jobs:
  prepare:
    uses: tangle-network/traces/.github/workflows/qualify-release.yml@4829b1a2f838684521ca8bdcc959ae4df9efdd40
    # The caller ceiling permits the GitHub-release job; prepare keeps contents: read.
    permissions:
      contents: write
    with:
      existing_tag: ${{ inputs.existing_tag }}

  publish:
    needs: prepare
    if: needs.prepare.outputs.exists != 'true'
    # npm trusted publishing requires a GitHub-hosted runner.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: traces-release
          path: ${{ runner.temp }}/release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tangle-network/agent-runtime
          ref: e562074c43e12066fdb02e10e239cfd716760b9c
          path: release-policy
          sparse-checkout: |
            /scripts/
            /package.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Admit the qualified npm artifact
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum --check SHA256SUMS
          parser_range=$(node -p "require(process.env.GITHUB_WORKSPACE + '/release-policy/package.json').devDependencies['oxc-parser']")
          admission_deps=$(mktemp -d "$RUNNER_TEMP/admission-deps.XXXXXX")
          trap 'rm -rf "$admission_deps"' EXIT
          npm install --prefix "$admission_deps" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund "oxc-parser@$parser_range"
          ln -s "$admission_deps/node_modules" "$GITHUB_WORKSPACE/release-policy/node_modules"
          node "$GITHUB_WORKSPACE/release-policy/scripts/check-version-bump.mjs" --archive "$RUNNER_TEMP/release/package.tgz"
      - name: Publish the verified npm artifact
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum --check SHA256SUMS
          npm publish package.tgz --access public --ignore-scripts

  github-release:
    needs: [prepare, publish]
    if: always() && needs.prepare.result == 'success' && (needs.publish.result == 'success' || needs.prepare.outputs.exists == 'true')
    uses: tangle-network/traces/.github/workflows/qualify-release.yml@4829b1a2f838684521ca8bdcc959ae4df9efdd40
    permissions:
      contents: write
    with:
      phase: github-release
      tag: ${{ needs.prepare.outputs.tag }}
