name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      existing_tag:
        description: 'Existing v* tag to publish without creating a new version commit'
        required: true
        type: string

concurrency:
  group: traces-publish
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, ci-public]
    permissions:
      contents: read
    outputs:
      tag_name: ${{ steps.publish-tag.outputs.tag_name }}
      ref: ${{ steps.publish-tag.outputs.ref }}
      publish: ${{ steps.npm-version.outputs.exists != 'true' }}
    steps:
      - name: Select publish tag
        id: publish-tag
        env:
          EXISTING_TAG: ${{ inputs.existing_tag }}
        run: |
          if [ -n "$EXISTING_TAG" ]; then
            case "$EXISTING_TAG" in
              v*) TAG_NAME="$EXISTING_TAG" ;;
              *) TAG_NAME="v$EXISTING_TAG" ;;
            esac
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            echo "No release tag was provided" >&2
            exit 1
          fi

          if ! printf '%s\n' "$TAG_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid release tag: $TAG_NAME" >&2
            exit 1
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$TAG_NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.publish-tag.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag is merged to main
        run: |
          git fetch origin main:refs/remotes/origin/main --no-tags
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tag must point to a commit merged into main" >&2
            exit 1
          fi
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        id: package
        env:
          TAG_NAME: ${{ steps.publish-tag.outputs.tag_name }}
        run: |
          TAG_VERSION="${TAG_NAME#v}"
          PACKAGE_VERSION="$(node -e "console.log(JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version)")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "tag version $TAG_VERSION does not match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi
          PACKAGE_NAME="$(node -e "console.log(JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).name)")"
          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Check npm version
        id: npm-version
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --registry=https://registry.npmjs.org 2>/dev/null | grep -qx "$PACKAGE_VERSION"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify (typecheck + test + build)
        run: |
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm check:package

  # npm trusted publishing runs on GitHub-hosted runners only, so this job
  # starts only when the verified version is not yet on npm.
  publish:
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance / OIDC trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish to npm
        # Requires npm trusted publishing for tangle-network/traces, publish.yml.
        # Token configuration takes precedence over its short-lived identity.
        run: npm publish --access public --ignore-scripts
        env:
          NPM_CONFIG_PROVENANCE: 'true'

  release:
    needs: [verify, publish]
    if: >-
      always() &&
      needs.verify.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: [self-hosted, ci-public]
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.verify.outputs.tag_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "GitHub release $TAG_NAME already exists"
          else
            gh release create "$TAG_NAME" \
              --title "$TAG_NAME" \
              --notes "Published @tangle-network/traces@${TAG_NAME#v} to npm."
          fi
