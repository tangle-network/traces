name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      existing_tag:
        description: 'Existing v* tag to publish without creating a new version commit'
        required: true
        type: string

concurrency:
  group: traces-publish
  cancel-in-progress: false

jobs:
  prepare:
    uses: tangle-network/traces/.github/workflows/qualify-release.yml@9563a87e4cafc5bbd4b4d5edc27f90b1835bc217
    permissions:
      contents: read
    with:
      existing_tag: ${{ inputs.existing_tag }}

  publish:
    needs: prepare
    if: needs.prepare.outputs.exists != 'true'
    # npm trusted publishing requires a GitHub-hosted runner.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: traces-release
          path: ${{ runner.temp }}/release
      - name: Publish the verified npm artifact
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum --check SHA256SUMS
          npm publish package.tgz --access public --ignore-scripts

  github-release:
    needs: [prepare, publish]
    if: always() && needs.prepare.result == 'success' && (needs.publish.result == 'success' || needs.prepare.outputs.exists == 'true')
    uses: tangle-network/traces/.github/workflows/qualify-release.yml@9563a87e4cafc5bbd4b4d5edc27f90b1835bc217
    permissions:
      contents: write
    with:
      phase: github-release
      tag: ${{ needs.prepare.outputs.tag }}
